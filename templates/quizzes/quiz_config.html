{% extends 'base.html' %}
{% load static %}

{% block title %}Configure Your Quiz | Quiz Pro{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="glass-panel mx-auto" style="max-width: 600px; padding: 3rem;">
        <h2 class="text-center mb-4">Quiz <span>Configuration</span></h2>
        <p class="text-center text-muted mb-5">Topic: <strong>{{ subcategory.name_en }}</strong></p>

        <form action="{% url 'start_quiz' subcategory.id %}" method="get">
            <div class="form-group mb-5">
                <label class="d-block mb-3">Choose Difficulty</label>
                <div class="difficulty-options">
                    <label class="diff-radio">
                        <input type="radio" name="difficulty" value="easy" checked>
                        <div class="diff-card">
                            <i class="fas fa-leaf"></i>
                            <span>Easy</span>
                        </div>
                    </label>
                    <label class="diff-radio">
                        <input type="radio" name="difficulty" value="medium">
                        <div class="diff-card">
                            <i class="fas fa-bolt"></i>
                            <span>Medium</span>
                        </div>
                    </label>
                    <label class="diff-radio">
                        <input type="radio" name="difficulty" value="hard">
                        <div class="diff-card">
                            <i class="fas fa-fire"></i>
                            <span>Hard</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="info-box mb-5">
                <div class="info-item"><i class="fas fa-clock"></i> <span>10 Minutes</span></div>
                <div class="info-item"><i class="fas fa-question-circle"></i> <span>10 AI Questions</span></div>
                <div class="info-item"><i class="fas fa-trophy"></i> <span>XP Rewards</span></div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 py-3">
                <i class="fas fa-play mr-2"></i> Start Dynamic Quiz
            </button>
        </form>
    </div>
</div>

<style>
    .difficulty-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
    }

    .diff-radio input {
        display: none;
    }

    .diff-card {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1.5rem 1rem;
        border-radius: 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .diff-card i {
        display: block;
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }

    .diff-radio input:checked+.diff-card {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        transform: scale(1.05);
    }

    .info-box {
        display: flex;
        justify-content: space-around;
        background: rgba(var(--primary-rgb), 0.05);
        padding: 1.5rem;
        border-radius: 15px;
    }

    .info-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
    }

    .info-item i {
        color: var(--primary);
        font-size: 1.2rem;
    }
</style>
{% endblock %}
